<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Page</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    #scriptSection {
      display: none;
      margin-top: 25px;
    }

    button {
      padding: 14px 35px;
      border: 2px solid black;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 20px;
      font-weight: bold;
    }

    .script-box {
      padding: 20px;
      border: 2px solid black;
      border-radius: 10px;
      background: #f5f5f5;
      max-width: 500px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="container">
    <button onclick="openScript()">SCRIPT</button>

    <div id="scriptSection">
      <h2>Script</h2>

      <div class="script-box">
        loadstring(game:HttpGet("https://raw.githubusercontent.com/ScriptsSab/DuelScript/refs/heads/main/Silencedvs.lua"))()
      </div>
    </div>
  </div>

  <script>
    function openScript() {
      document.getElementById("scriptSection").style.display = "block";
    }
  </script>

</body>
</html>
