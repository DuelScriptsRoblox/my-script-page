<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Page</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    #scriptSection {
      display: none;
      margin-top: 25px;
    }

    button {
      padding: 14px 35px;
      border: 2px solid black;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: black;
      color: white;
    }

    .script-box {
      padding: 20px;
      border: 2px solid black;
      border-radius: 10px;
      background: #f5f5f5;
      max-width: 500px;
      word-break: break-all;
    }

    #copyButton {
      margin-top: 12px;
      padding: 10px 24px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container">

    <button onclick="openScript()">SCRIPT</button>

    <div id="scriptSection">
      <h2>Script</h2>

      <div class="script-box">
        loadstring(game:HttpGet("https://raw.githubusercontent.com/DuelScripts/Op/refs/heads/main/duels"))()
      </div>

      <button id="copyButton" onclick="copyScript()">COPY</button>
    </div>

  </div>

  <script>
    function openScript() {
      document.getElementById("scriptSection").style.display = "block";
    }

    function copyScript() {
      const script = document.querySelector(".script-box").innerText;
      navigator.clipboard.writeText(script);
    }
  </script>

</body>
</html>
