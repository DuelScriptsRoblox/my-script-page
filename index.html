<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Page</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    #scriptSection {
      display: none;
      margin-top: 25px;
    }

    button {
      padding: 14px 35px;
      border: 2px solid black;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: black;
      color: white;
    }

    .script-box {
      padding: 20px;
      border: 2px solid black;
      border-radius: 10px;
      background: #f5f5f5;
      max-width: 500px;
      word-break: break-all;
    }

    #copyButton {
      margin-top: 12px;
      padding: 10px 24px;
      font-size: 16px;
    }

    .script-card {
      margin-top: 30px;
    }

    #darkModeButton {
      margin-top: 30px;
      font-size: 16px;
    }

    body.dark {
      background: #111;
      color: white;
    }

    body.dark button {
      background: #222;
      color: white;
      border-color: white;
    }

    body.dark .script-box {
      background: #222;
      border-color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <button onclick="openScript()">SCRIPT</button>

    <div id="scriptSection">
      <h2>DUELS SCRIPT</h2>

      <div class="script-box">
        loadstring(game:HttpGet("https://raw.githubusercontent.com/DuelScripts/Op/refs/heads/main/duels"))()
      </div>

      <button id="copyButton" onclick="copyScript()">COPY</button>

      <div class="script-card">
        <h2>SERVER BYPASS SCRIPT</h2>
        <div class="script-box">
          loadstring(game:HttpGet("https://raw.githubusercontent.com/SolunaScript/Kawatan-Hub/refs/heads/main/Kawatan%20Script"))()
        </div>
        <button id="copyBypassButton" onclick="copyBypassScript()">COPY</button>
      </div>

      <button id="darkModeButton" onclick="toggleDarkMode()">🌙 DARK MODE</button>

    </div>

  </div>

  <script>
    function openScript() {
      document.getElementById("scriptSection").style.display = "block";
    }

    function copyScript() {
      const script = document.querySelector(".script-box").innerText;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(script);
      } else {
        const area = document.createElement("textarea");
        area.value = script;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      document.getElementById("copyButton").textContent = "COPIED!";
      setTimeout(() => {
        document.getElementById("copyButton").textContent = "COPY";
      }, 1500);
    }

    function copyBypassScript() {
      const script = document.querySelectorAll(".script-box")[1].innerText;
      navigator.clipboard.writeText(script).catch(() => {});
      document.getElementById("copyBypassButton").textContent = "COPIED!";
      setTimeout(() => {
        document.getElementById("copyBypassButton").textContent = "COPY";
      }, 1500);
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }
  </script>

</body>
</html>
